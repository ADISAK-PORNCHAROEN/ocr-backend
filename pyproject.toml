[project]
name = "ocr-backend"
version = "0.1.0"
description = "Local FastAPI playground for Thai and English document OCR"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.120",
    "huggingface-hub>=0.35",
    "numpy>=2,<3",
    "onnxruntime>=1.23.2",
    "opencv-python-headless>=4.8",
    "pillow>=12.3",
    "pydantic-settings>=2.11",
    "pyclipper>=1.4",
    "pypdf>=6.4",
    "pypdfium2>=5.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "reportlab>=4.4",
    "ruff>=0.14",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*", "cv2", "pyclipper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

